<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LUNA</title>
    <!-- GitHub Pages SPA fallback: encode the requested path into a ?/ query and
         bounce to index.html, which restores it (see the script in index.html).
         pathSegmentsToKeep = 1 preserves the /<repo-name>/ project-site prefix. -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
