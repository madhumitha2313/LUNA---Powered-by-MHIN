nsight for you.",insightSave:"Save",insightSaved:"Saved",insightAsk:"Ask Mira",moodTitle:"How are you feeling right now?",moodHappy:"Happy",moodCalm:"Calm",moodTired:"Tired",moodSad:"Sad",moodAnxious:"Anxious",moodEmotional:"Emotional",moodSaved:"Logged — thank you for checking in. 💗",miraRemembers:"Mira Remembers",memAvgPre:"Your average cycle is about",memRegularPre:"Your cycles are usually",memMoodPre:"You last checked in feeling",memFirst:"The more you share, the more Mira learns about you.",dailyRecs:"For you today",recRestT:"Rest well",recRestB:"Give your body permission to slow down today.",recIronT:"Iron-rich food",recIronB:"Leafy greens, dates and lentils help replenish iron.",recWarmT:"Stay warm",recWarmB:"A warm compress or drink can ease cramps.",recMoveT:"Gentle movement",recMoveB:"A short walk or stretch lifts energy and mood.",recHydrateT:"Hydrate",recHydrateB:"Aim for a glass of water now — it helps more than you think.",recFreshT:"Fresh foods",recFreshB:"Colourful fruit and veg support this higher-energy phase.",recBreatheT:"Breathe",recBreatheB:"Two minutes of slow breathing calms the body.",recComfortT:"Kind comfort",recComfortB:"A little dark chocolate and rest are okay — be gentle with yourself.",chatTitle:"Mira",chatOnline:"Always here for you",chatListening:"Listening…",chatTyping:"Mira is typing…",chatSpeaking:"Speaking…",chatAiCompanion:"AI companion",chatPlaceholder:"Message Mira…",chatRecFoods:"Foods that help",chatRecWellness:"Feel better",callContact:"Call",imSafe:"I'm safe for now — close",there:"there",chatCycleNote:"You're on day {day} of your cycle.",chatGreet1:"Good to see you, {name} 🌸 How are you feeling today?",chatGreet2:"Hi {name} 💕 I hope you're taking care of yourself today.",chatGreet3:"Hello, {name}! Ready to check in with yourself?",chatGreet4:"Hey {name} 🌸 I'm here whenever you need me. What's on your mind?",chip1:"I have a headache",chip2:"My period is late",chip3:"I feel low today",chip4:"What can I eat?",empathySymptom:"I'm sorry you're feeling that.",empathyUrgent:"Thank you for telling me — let's take this seriously and gently.",askHeadache:"Can I ask a couple of things? When did it start, have you eaten and had water today, and is the pain mild, moderate or severe?",askCramps:"I'm sorry — cramps can be draining. Where do you feel it most, and would you say it's mild, moderate or severe?",askLate:"How many days late are you, and have your cycles been regular lately? Any stress or changes in routine?",askHeavy:"How heavy is it — are you soaking through a pad in under two hours, or passing large clots? And how are you feeling in yourself?",askNausea:"When did the nausea start, and have you been able to keep water or food down?",askAcne:"Where are the breakouts mostly, and does it tend to flare around your period?",askPcos:"Have you been diagnosed with PCOS, or noticing signs like irregular cycles, acne or hair changes? Tell me a little more.",askTired:"That sounds tough. How have you been sleeping, and roughly where are you in your cycle?",adviceHeadache:"Thank you. Try water and a small snack first, rest your eyes a little, and fresh air or a short walk can help. If it stays severe or comes with vision changes, please see a doctor.",adviceCramps:"A warm compress on your lower belly, gentle stretching and staying hydrated usually help, along with magnesium-rich foods. If the pain is severe every cycle, it is worth seeing a gynaecologist.",adviceLate:"A few days' shift is very common with stress, travel or sleep changes. Keep logging in the tracker — if it is more than a week late or unusual for you, a check-up gives peace of mind.",adviceHeavy:"Please rest, stay hydrated and eat iron-rich foods. Soaking a pad hourly or large clots is worth getting checked soon — please contact a doctor. I am here with you.",adviceNausea:"Small sips of water, ginger tea and plain foods like banana or toast can settle it. Rest and avoid strong smells. If it keeps up or you cannot keep fluids down,  🌸 இன்று எப்படி உணர்கிறீர்கள்?",chatGreet2:"வணக்கம் {name} 💕 இன்று உங்களை நன்றாக கவனித்துக்கொள்ளுங்கள்.",chatGreet3:"வணக்கம், {name}! உங்களுடன் ஒரு நிமிடம் செலவிடத் தயாரா?",chatGreet4:"வணக்கம் {name} 🌸 உங்களுக்கு எப்போது வேண்டுமானாலும் நான் இங்கே இருக்கிறேன். என்ன நினைக்கிறீர்கள்?",chip1:"எனக்கு தலைவலி இருக்கு",chip2:"என் மாதவிடாய் தாமதம்",chip3:"இன்று மனம் சரியில்லை",chip4:"நான் என்ன சாப்பிடலாம்?",empathySymptom:"நீங்கள் அப்படி உணர்வது வருத்தமாக இருக்கிறது.",empathyUrgent:"சொன்னதற்கு நன்றி — இதை கவனமாகவும் மென்மையாகவும் எடுத்துக்கொள்வோம்.",askHeadache:"சில கேள்விகள் கேட்கலாமா? எப்போது தொடங்கியது, இன்று சாப்பிட்டீர்களா, தண்ணீர் குடித்தீர்களா, வலி லேசானதா, நடுத்தரமா, கடுமையானதா?",askCramps:"வருத்தமாக இருக்கிறது — வயிற்று வலி களைப்பூட்டும். எங்கே அதிகமாக உணர்கிறீர்கள், அது லேசானதா, நடுத்தரமா, கடுமையானதா?",askLate:"எத்தனை நாட்கள் தாமதம், சமீபத்தில் உங்கள் சுழற்சிகள் ஒழுங்காக இருந்ததா? ஏதேனும் மன அழுத்தம் அல்லது வழக்கத்தில் மாற்றம்?",askHeavy:"எவ்வளவு அதிகம் — இரண்டு மணி நேரத்திற்குள் ஒரு பேட் நிறைகிறதா, பெரிய கட்டிகள் வருகிறதா? நீங்கள் எப்படி உணர்கிறீர்கள்?",askNausea:"குமட்டல் எப்போது தொடங்கியது, தண்ணீர் அல்லது உணவை உள்ளே வைத்திருக்க முடிந்ததா?",askAcne:"முகப்பரு பெரும்பாலும் எங்கே, அது மாதவிடாய் நேரத்தில் அதிகரிக்கிறதா?",askPcos:"உங்களுக்கு PCOS கண்டறியப்பட்டதா, அல்லது ஒழுங்கற்ற சுழற்சி, முகப்பரு, முடி மாற்றம் போன்ற அறிகுறிகள் தெரிகிறதா? கொஞ்சம் சொல்லுங்கள்.",askTired:"அது கடினமாக இருக்கும். எப்படி தூங்குகிறீர்கள், உங்கள் சுழற்சியில் தோராயமாக எங்கே இருக்கிறீர்கள்?",adviceHeadache:"நன்றி. முதலில் தண்ணீரும் சிறு தின்பண்டமும் சாப்பிடுங்கள், கண்களுக்கு சிறிது ஓய்வு கொடுங்கள், சுத்தமான காற்று அல்லது சிறு நடை உதவும். கடுமையாக இருந்தால் அல்லது பார்வை மாற்றத்துடன் வந்தால், மருத்துவரைப் பாருங்கள்.",adviceCramps:"வயிற்றின் கீழ் பகுதியில் சூடான ஒத்தடம், மென்மையான நீட்சி, நீரேற்றம் மற்றும் மெக்னீசியம் நிறைந்த உணவுகள் உதவும். ஒவ்வொரு சுழற்சியிலும் கடுமையான வலி இருந்தால், மகப்பேறு மருத்துவரைப் பார்ப்பது நல்லது.",adviceLate:"மன அழுத்தம், பயணம் அல்லது தூக்க மாற்றங்களால் சில நாட்கள் மாறுவது மிகவும் பொதுவானது. டிராக்கரில் பதிவு செய்யுங்கள் — ஒரு வாரத்திற்கு மேல் தாமதமானால் அல்லது வழக்கத்திற்கு மாறாக இருந்தால், பரிசோதனை மன அமைதி தரும்.",adviceHeavy:"ஓய்வெடுங்கள், நீரேற்றத்துடன் இருங்கள், இரும்புச்சத்து நிறைந்த உணவை சாப்பிடுங்கள். ஒவ்வொரு மணி நேரமும் பேட் நிறைந்தால் அல்லது பெரிய கட்டிகள் வந்தால் விரைவில் பரிசோதிப்பது நல்லது — மருத்துவரைத் தொடர்பு கொள்ளுங்கள். நான் உங்களுடன் இருக்கிறேன்.",adviceNausea:"சிறிது சிறிதாக தண்ணீர், இஞ்சி தேநீர் மற்றும் வாழைப்பழம் அல்லது டோஸ்ட் போன்ற எளிய உணவுகள் அமைதிப்படுத்தும். ஓய்வெடுங்கள், கடுமையான வாசனைகளைத் தவிர்க்கவும். தொடர்ந்தால் அல்லது திரவங்களை உள்ளே வைக்க முடியாவிட்டால், மருத்துவரைப் பாருங்கள்.",adviceAcne:"மாதவிடாய் நேரத்தில் ஹார்மோன் முகப்பரு பொதுவானது. மென்மையான சுத்தம், தண்ணீர், தூக்கம் உதவும். தொடர்ந்தால், தோல் மருத்துவர் அல்லது PCOS பரிசோதனை பயனுள்ளதாக இருக்கும்.",advicePcos:"பகிர்ந்ததற்கு நன்றி. மென்மையான வழக்கமான இயக்கம், சமச்சீர் உணவு, நல்ல தூக்கம் உண்மையிலேயே உதவும். இங்கே உங்கள் சுழற்சியைப் பதிவு செய்வது ஒரு தெளிவான படத்தை உருவாக்கும் — மகப்பேறு அல்லது நாளமில்லா சுரப்பி நிபுணரிடம் எடுத்துச் செல்லுங்கள்.",adviceTired:"உங்களிடம் அன்பாக இருங்கள் — சுழற்சியின் சில பகுதிகளில் ஆற்றல் இயற்கையாகவே குறையும். இரும்புச்சத்து உணவு, தண்ணீர், பகல் வெளிச்சம், சீக்கிர உறக்கம் உதவும். தொடர்ந்தால், இரும்புச்சத்து அளவைப் பரிசோதிப்பது நல்லது.",replySad:"நான் கேட்கிறேன், நீங்கள் சொன்னதில் மகிழ்ச்சி — உங்கள் உணர்வுகள் சரியானவை. ஒன்றாக ஒரு மெதுவான மூச்சு எடுப்போம்: நான்கு எண்ணி உள்ளிழுத்து, ஆறு எண்ணி வெளியிடுங்கள். ஒரு சிறு நடை அல்லது நம்பகமான ஒருவருக்கு செய்தி அனுப்புவதும் உதவும். நான் இங்கே இருக்கிறேன்.",replyStress:"அது சுமக்க நிறைய இருப்பது போல் தெரிகிறது. ஒரு கணம் மெதுவாகுவோம் — நான்கு எண்ணி உள்ளிழுத்து, ஆறு எண்ணி வெளியிடுங்கள், சில முறை. ஒரு நேரத்தில் ஒரு சிறு அடி போதும். நான் உங்களுடன் இங்கே இருக்கிறேன்.",replyFood:"உதவ மகிழ்ச்சி! உங்கள் சுழற்சியில், வண்ணமயமான காய்கறிகள், பழங்கள், முழு தானியங்கள் மற்றும் இரும்புச்சத்து உணவுகள் ஆற்றலை நிலையாக வைக்கும். எப்படி உணர்கிறீர்கள் என்று சொல்லுங்கள், நான் தனிப்பயனாக்குகிறேன்.",replyThanks:"எப்போதும். உதவ முடிந்ததில் மகிழ்ச்சி — இன்று உங்களை மென்மையாக கவனித்துக்கொள்ளுங்கள். 💗",replyGreeting:"வணக்கம் 🌸 உங்களிடமிருந்து கேட்டதில் மகிழ்ச்சி. இன்று எப்படி உணர்கிறீர்கள்?",replyGeneral:"நான் உங்களுக்காக இங்கே இருக்கிறேன். நீங்கள் எப்படி உணர்கிறீர்கள் அல்லது எதற்கு உதவி வேண்டும் என்று கொஞ்சம் சொல்லுங்கள் — உங்கள் உடல், மனநிலை, உணவு, தூக்கம், எதுவானாலும்.",recWater:"தண்ணீர்",recLeafyGreens:"கீரை",recDates:"பேரீச்சை",recGingerTea:"இஞ்சி தேநீர்",recBanana:"வாழைப்பழம்",recWarmSoup:"சூடான சூப்",recDarkChoc:"டார்க் சாக்லேட்",recDoctor:"மருத்துவரைப் பாருங்கள்",recRestNap:"ஓய்வு / சிறு உறக்கம்",recShortWalk:"சிறு நடை",recBreathing:"மூச்சுப்பயிற்சி",recWarmCompress:"சூடான ஒத்தடம்",recStretch:"மென்மையான நீட்சி",recMeditate:"தியானம்",trackerBadge:"மாதவிடாய் & சுழற்சி",trackerTitle:"சுழற்சி டிராக்கர்",trackerSub:"உங்கள் மாதவிடாய் தொடங்கும் நாளைப் பதிவு செய்யுங்கள் — மீரா உங்கள் வரலாற்றிலிருந்து மற்றவற்றை மதிப்பிடும்.",periodStart:"மாதவிடாய் தொடக்கம்",log:"பதிவு",cycleDayLabel:"சுழற்சி நாள்",logToBegin:"தொடங்க பதிவு செய்யுங்கள்",avgCycle:"சராசரி சுழற்சி",needsLogs:"3+ பதிவுகள் தேவை",phaseMenstrual:"மாதவிடாய்",phaseFollicular:"ஃபாலிகுலர்",phaseOvulation:"அண்டவிடுப்பு",phaseLuteal:"லூடியல்",phaseWord:"கட்டம்",noteMenstrual:"மாதவிடாய் நாட்கள் — ஓய்வும் இரும்புச்சத்து உணவும் உதவும்.",noteFollicular:"இந்தக் கட்டத்தில் ஆற்றல் பொதுவாக அதிகரிக்கும்.",noteOvulation:"சுழற்சியின் நடுவில், மிகவும் கருவுறும் காலம்.",notePMS:"அடுத்த மாதவிடாய்க்கு முன் PMS அறிகுறிகள் தோன்றலாம்.",regRegular:"ஒழுங்கானது",regSlightly:"சற்று ஒழுங்கற்றது",regIrregular:"ஒழுங்கற்றது",loggedWord:"பதிவு",lastStart:"கடைசி தொடக்கம்",next4weeks:"அடுத்த 4 வாரங்கள்",predictedPeriodLabel:"கணிக்கப்பட்ட மாதவிடாய்",fertileWindow:"கருவுறும் காலம்",todayLabel:"இன்று",predictionsNote:"கணிப்புகள் உங்கள் பதிவு செய்யப்பட்ட தேதிகளின் மதிப்பீடுகள் — உத்தரவாதம் அல்ல, கருத்தடை ஆலோசனையும் அல்ல.",loggedStarts:"பதிவு செய்யப்பட்ட மாதவிடாய் தொடக்கங்கள்",noDatesLogged:'இன்னும் தேதிகள் எதுவும் பதிவு செய்யப்படவில்லை. உங்கள ஃபெரிடின், Hb) பற்றி பேசுவது நல்லது.",indPcos:"பல PCOS/PCOD தொடர்பான அறிகுறிகள் பதிவு — PCOS பரிசோதனையைக் கருதுங்கள் (அல்ட்ராசவுண்ட் + ஹார்மோன் பேனல்).",indIrregular:"ஒழுங்கற்ற சுழற்சி நீளம் கவனிக்கப்பட்டது — மகப்பேறு மருத்துவருடன் சுழற்சி ஒழுங்குமுறை பற்றி பேசுங்கள்.",indNone:"கிடைத்த பதிவுகளிலிருந்து குறிப்பிட்ட அபாய முறை எதுவும் இல்லை. வழக்கமான பதிவைத் தொடருங்கள்.",rptDisclaimer:"இந்த சுருக்கம் மீராவில் நீங்களே தெரிவித்த பதிவுகளிலிருந்து உருவாக்கப்பட்டது. இது விவாதத்திற்கான அபாய அறிகுறிகளையும் முறைகளையும் பட்டியலிடுகிறது — இது நோய் கண்டறிதல் அல்ல, மருத்துவ மதிப்பீட்டுக்கு மாற்றாகாது. மீரா · MHIN ஆல் உருவாக்கப்பட்டது.",rptFindSpecialist:"எனக்கு அருகில் நிபுணரைத் தேடு",ftBadge:"மீரா செய்யும் அனைத்தும்",ftTitle:"அம்சங்கள், முழுமையாக",ftSub:"சிதறிய சமிக்ஞைகளை ஒரு தொடர்ச்சியான, புரிந்துகொள்ளக்கூடிய ஆரோக்கியக் கதையாக மாற்ற ஒன்பது திறன்கள் ஒன்றாக செயல்படுகின்றன — குரல் முதன்மை, வடிவமைப்பால் தனிப்பட்டது.",ftVoiceT:"குரல் முதன்மை",ftVoiceB:"படிவங்களைத் தவிர்க்கவும். இயல்பாகப் பேசுங்கள், மீரா உரையாடலை ஒரு கட்டமைக்கப்பட்ட ஆரோக்கியப் பதிவாக மாற்றுகிறது — ஓட்டம், வலி, மனநிலை, தூக்கம், மன அழுத்தம் மேலும் பல.",ftVoiceP1:"இயல்பான, உரையாடல் பேச்சு",ftVoiceP2:"பிரித்தெடுத்தல் சிப்களுடன் நேரடி படியெடுத்தல்",ftVoiceP3:"சந்தேகம் இருக்கும்போது தொடர் கேள்வியுடன் நம்பிக்கை சரிபார்ப்பு",ftMemT:"AI நினைவகம்",ftMemB:"ஒவ்வொரு பதிவும் முந்தையதன் மீது கட்டமைக்கப்படுகிறது. மீரா சுழற்சிகள் முழுவதும் சூழலை வைத்திருக்கிறது, எனவே உங்கள் வரலாறு தொடர்ச்சியானது, துண்டிக்கப்பட்ட பதிவுகளின் குவியல் அல்ல.",ftMemP1:"சுழற்சிகள் முழுவதும் சூழல்",ftMemP2:"நகரும் காலங்களில் கணக்கிடப்பட்ட போக்குகள்",ftMemP3:"வருகைகளுக்கு இடையே எதுவும் இழக்கப்படவில்லை",ftDocT:"ஆவண நுண்ணறிவு",ftDocB:"ஒரு ஆய்வக அறிக்கையைப் பதிவேற்றுங்கள், மீரா அதைப் படிக்கிறது — ஹீமோகுளோபின், ஃபெரிடின், வைட்டமின் D மற்றும் ஹார்மோன் மதிப்புகளை எடுத்து, அவற்றை உங்கள் அபாய அறிகுறிகளில் சேர்க்கிறது.",ftDocP1:"PDF & பட அறிக்கைகள்",ftDocP2:"முக்கிய இரத்த/ஹார்மோன் மதிப்புகளைத் தானாக எடுக்கிறது",ftDocP3:"குறைந்த ஃபெரிடின் இரத்த சோகை அறிகுறிகளை வலுப்படுத்துகிறது",ftCycleT:"மாதவிடாய் & சுழற்சி டிராக்கர்",ftCycleB:"மாதவிடாய் தொடக்க தேதிகளைப் பதிவு செய்யுங்கள், மீரா உங்கள் சுழற்சி நீளம், தற்போதைய கட்டம் மற்றும் அடுத்த கணிக்கப்பட்ட தேதியை மதிப்பிடுகிறது — அனைத்தும் உங்கள் பதிவுகளிலிருந்து.",ftCycleP1:"உண்மையான தரவிலிருந்து சுழற்சி நீளம் & கட்டம்",ftCycleP2:"அடுத்த மாதவிடாய் கணிப்பு",ftCycleP3:"காலப்போக்கில் ஒழுங்கு சமிக்ஞை",ftPcosT:"PCOS / PCOD அறிகுறி கண்காணிப்பு",ftPcosB:"பொதுவான PCOS/PCOD அறிகுறிகளை காலப்போக்கில் பதிவு செய்து எவை ஒன்றாக வருகின்றன என்பதைப் பாருங்கள் — மகப்பேறு மருத்துவரிடம் காட்ட ஒரு தெளிவான படம்.",ftPcosP1:"வழிகாட்டப்பட்ட அறிகுறி சரிபார்ப்பு பட்டியல்",ftPcosP2:"வாரங்கள் முழுவதும் முறை பார்வை",ftPcosP3:"கல்வி சார்ந்தது, ஒருபோதும் நோய் கண்டறிதல் அல்ல",ftTrendT:"போக்கு நுண்ணறிவு",ftTrendB:"நகரும் சுழற்சி நீளம், வலி மற்றும் ஓட்ட போக்குகள் விவாதிக்கத்தக்க முறைகளை வெளிப்படுத்துகின்றன — எப்போதும் அபாய அறிகுறியாக, ஒருபோதும் நோய் கண்டறிதல் அல்ல.",ftTrendP1:"நகரும் சுழற்சி நீள போக்கு",ftTrendP2:"தொடர்புகள்: தூக்கம் · மன அழுத்தம் · வலி",ftTrendP3:"எளிய மொழி விளக்கங்கள்",ftDocSumT:"மருத்துவர் சுருக்கம்",ftDocSumB:"ஒரே தட்டில் மாதக்கணக்கான பதிவுகளையும் அறிக்கை கண்டுபிடிப்புகளையும் உங்கள் மருத்துவர் நொடிகளில் படிக்கக்கூடிய தெளிவான மருத்துவ சுருக்கமாக மாற்றுகிறது — ஏற்றுமதி விருப்பத்துடன்.",ftDocSumP1:"சுழற்சி & அறிகுறி வரலாறு",ftDocSumP2:"அறிக்கை கண்டுபிடிப்புகள் சேர்க்கப்பட்டுள்ளன",ftDocSumP3:"PDF ஆக ஏற்றுமதி",ftCommT:"சமூக நுண்ணறிவு",ftCommB:"ஒரு தனிநபரை ஒருபோதும் வெளிப்படுத்தாத அநாமதேய, மக்கள்தொகை அளவிலான நுண்ணறிவுகள் — k≥10 அடக்குமுறை வரம்பால் பாதுகாக்கப்பட்டு, தெரியும் தனியுரிமை பேட்ஜுடன் காட்டப்படுகிறது.",ftCommP1:"குழு & மாதம் வாரியாக தொகுக்கப்பட்டது",ftCommP2:"k≥10 அடக்குமுறை (வேறுபட்ட தனியுரிமை அல்ல)",ftCommP3:'"k-அநாமதேயத்தால் பாதுகாக்கப்பட்டது" குறிகாட்டி',ftSustT:"நிலைத்தன்மை",ftSustB:"வெளியிடப்பட்ட வாழ்க்கைச் சுழற்சி மதிப்பீட்டுத் தரவைப் பயன்படுத்தி, உங்கள் தயாரிப்பு தேர்வுகளின் மாதிரி சுற்றுச்சூழல் தடத்தைப் பாருங்கள் — சென்சார் அளவிடப்பட்டதல்ல, மாதிரி என தெளிவாகக் குறிக்கப்பட்டுள்ளது.",ftSustP1:"உங் ter-of-fact — this is health, not a secret shame. Keep supplies at home, let her rest if she has cramps, and make sure she never has to hide or feel dirty.",teacher:"Keep spare pads and a clean space in school. Allow washroom breaks without questions, never call attention to a girl on her period, and treat stains or leaks quietly and kindly. A calm classroom keeps girls in school.",ngo:"Pair this guide with a real kit and a short, friendly session. Use local language, invite questions anonymously, and include mothers where you can. Normalise, don't lecture — dignity and supplies together keep girls confident and in school."};return{languageLabel:"English",title:"First Period Readiness Guide",metaLabel:`For a girl aged ${e} · prepared by her ${_r.en[t].toLowerCase()}`,sections:[{heading:"1. What Is a Period?",blocks:[{type:"p",text:"At around your age, your body is quietly growing up — and one of the signs is your first period, called menarche."},{type:"p",text:"Every month, your body gets ready in case it might one day grow a baby (many years from now). When it isn't needed, the soft lining inside comes out slowly as a little blood through your vagina, over a few days. That is a period. It is healthy, natural, and it happens to almost every girl in the world."}]},{heading:"2. What Will I Feel?",blocks:[{type:"p",text:"A few days before or during your period you might notice:"},{type:"ul",items:["A dull ache or cramps in your lower tummy","Feeling a bit tired or sleepy","Slightly sore or fuller breasts","A few pimples, or a heavy/bloated feeling","Mood changes — feeling extra happy, teary, or annoyed for no clear reason"]},{type:"p",text:"All of that is completely normal. It settles in a few days."},{type:"callout",label:"Tell a trusted adult or see a doctor if:",items:["You soak through a pad or cloth every 1–2 hours","The pain is so bad you cannot do anything, even after rest","Bleeding lasts more than 7–8 days","You feel very dizzy, weak, or breathless"]}]},{heading:"3. What's Normal in Your Area",blocks:[{type:"p",text:s}]},{heading:"4. Your First Period Kit",blocks:[{type:"p",text:"Keep a small kit ready. Any of these work — choose what is comfortable and easy for you to get. No choice is better or worse than another:"},{type:"kit",items:[{t:"Disposable sanitary pads",d:"Available at any medical shop or kirana store, often in small low-cost packs. Easy for beginners and for school."},{t:"Reusable cloth pads",d:"Washable and reusable for many months — gentle on the budget over time. Dry them fully in sunlight."},{t:"Clean, soft cotton cloth",d:"The traditional option many mothers used. Wash well with soap, dry in bright sunlight, and keep it dry and clean."},{t:"Menstrual cup",d:"A soft cup, reusable for years — very economical and eco-friendly. Takes a little practice; good to learn when you feel ready."},{t:"A small pouch",d:"Spare underwear, a paper bag or old newspaper to wrap used products, and a little soap — keep it in your school bag, just in case."}]}]},{heading:"5. What To Do When It Happens",blocks:[{type:"ol",items:["Take a slow breath — nothing is wrong. This is your body working exactly right.","Go to the washroom. Place a pad on your underwear, or use a folded clean cloth or your cup.","If you are caught without supplies, fold some tissue or clean cloth in your underwear for now, and tell someone you trust.","Change your pad or cloth every 4–6 hours, more often if the flow is heavy.","Wash your hands. Wrap used pads/cloth in paper before throwing them in a bin — never flush pads.","Drink water and eat normally. For cramps, press a warm cloth or bottle on your lower tummy.","Mark the date somewhere (or in MIRA) so you slowly learn your own rhythm."]}]},{heading:"6. Questions You Might Feel Shy to Ask",blocks:[{type:"qa",items:[{q:"Can other people tell I have my period?",a:"No. No one can see it. With a pad, cloth, or cup in place, you look and move completely normally. It is your private information to share only if you want to."},{q:"Can I bathe, play, run and go to school?",a:"Yes to all of it — a warm bath actually helps you feel fresh and eases cramps. About temple or kitchen customs, families differ; do what feels right for you and talk to a trusted adult. There is nothing dirty about you or your period."},{q:"Is the blood dirty, or a sign something is wrong?",a:"Not at all. It is a healthy sign your body is growing well. Over the whole period it is usually only a few spoonfuls, even though it can look like more. It is clean, normal, and nothing to fear."}]}]}],note:{heading:`A note for you (${_r.en[t]})`,text:a[t]}}}function v1({age:e,relationship:t,insight:n}){const s=n&&n!=="No local data available yet"?`உங்கள் பகுதியைப் பற்றிய ஒரு உண்மை: ${n}. அதாவது உங்களைச் சுற்றியுள்ள பல பெண்களும் இதையே அனுபவிக்கிறார்கள் — நீங்கள் தனியாக இல்லை.`:"உங்கள் பகுதிக்கான குறிப்பிட்ட தகவல் இன்னும் இல்லை, ஆனால் இது எப்போதும் உண்மை: உங்கள் தெரு, பள்ளி, ஊர் எங்கும் உள்ள பெண்களுக்கும் மாதவிடாய் வருகிறது. இது உலகின் மிக இயல்பான ஒன்று. நீங்கள் தனியாக இல்லை.",a={sister:"அவளுக்கு நம்பகமான தோழியாக இருங்கள். அமைதியாகவும் அன்பாகவும் நடந்துகொள்ளுங்கள் — கிண்டல் வேண்டாம், பெரிதாக்க வேண்டாம். ஒரு பேட் அல்லது துணியை தயாராக வைத்து, எப்படிப் பயன்படுத்துவது என்று ஒருமுறை காட்டுங்கள். உங்கள் அமைதி அவளுக்கும் அமைதி தரும்.",parent:"இந்த நாளை அவள் எப்படி நினைவில் வைத்திருப்பாள் என்பது உங்கள் எதிர்வினையைப் பொறுத்தது. அமைதியாக, இயல்பாக இருங்கள் — இது ஆரோக்கியம், மறைக்க வேண்டிய வெட்கம் அல்ல. வீட்டில் தேவையானவற்றை வைத்திருங்கள், வலி இருந்தால் ஓய்வு கொடுங்கள்.",teacher:"பள்ளியில் கூடுதல் பேட்களும் சுத்தமான இடமும் வைத்திருங்கள். கேள்வி கேட்காமல் கழிப்பறைக்குச் செல்ல அனுமதியுங்கள், மாதவிடாய் உள்ள பெண்ணை கவனத்திற்குக் கொண்டுவராதீர்கள். அமைதியான வகுப்பு பெண்களை பள்ளியில் தக்கவைக்கும்.",ngo:"இந்த வழிகாட்டியுடன் ஒரு உண்மையான கிட்டையும் சிறிய, நட்பான அமர்வையும் இணையுங்கள். உள்ளூர் மொழியில் பேசுங்கள், பெயர் சொல்லாமல் கேள்விகள் கேட்க அனுமதியுங்கள். போதிக்காதீர்கள் — இயல்பாக்குங்கள்; மரியாதையும் பொருட்களும் சேர்ந்தால் பெண்கள் நம்பிக்கையுடன் பள்ளியில் இருப்பார்கள்."};return{languageLabel:"தமிழ்",title:"முதல் மாதவிடாய் தயார்நிலை வழிகாட்டி",metaLabel:`${e} வயது பெண்ணுக்காக · ${_r.ta[t]} தயாரித்தது`,sections:[{heading:"1. மாதவிடாய் என்றால் என்ன?",blocks:[{type:"p",text:"உங்கள் வயதில், உங்கள் உடல் மெதுவாக வளர்ந்து வருகிறது — அதன் ஒரு அறிகுறிதான் முதல் மாதவிடாய்."},{type:"p",text:"ஒவ்வொரு மாதமும் உங்கள் உடல் தயாராகிறது. அது தேவைப்படாதபோது, உள்ளே உள்ள மென்மையான படலம் சில நாட்கள் சிறிது ரத்தமாக வெளியேறுகிறது. அதுதான் மாதவிடாய். இது ஆரோக்கியமானது, இயல்பானது, உலகின் ஏறக்குறைய எல்லாப் பெண்களுக்கும் நிகழ்வது."}]},{heading:"2. நான் எப்படி உணருவேன்?",blocks:[{type:"p",text:"மாதவிடாய்க்கு முன் அல்லது அந்த நாட்களில் இவை இருக்கலாம்:"},{type:"ul",items:["அடிவயிற்றில் லேசான வலி அல்லது இழுப்பு","சிறிது சோர்வு அல்லது தூக்கம்","மார்பகங்களில் லேசான வலி","சில பருக்கள் அல்லது வயிறு உப்பிய உணர்வு","மனநிலை மாற்றம் — சந்தோஷம், அழுகை அல்லது எரிச்சல்"]},{type:"p",text:"இவை அனைத்தும் முற்றிலும் இயல்பானவை. சில நாட்களில் சரியாகிவிடும்."},{type:"callout",label:"இவை இருந்தால் ஒரு பெரியவரிடம் அல்லது மருத்துவரிடம் சொல்லுங்கள்:",items:["ஒவ்வொரு 1–2 மணி நேரத்திற்கும் பேட்/துணி முழுவதும் நனைந்தால்","ஓய்வுக்குப் பிறகும் எதுவும் செய்ய முடியாத அளவு கடுமையான வலி","ரத்தப்போக்கு 7–8 நாட்களுக்கு மேல் நீடித்தால்","மயக்கம், மிகுந்த சோர்வு அல்லது மூச்சுத்திணறல்"]}]},{heading:"3. உங்கள் பகுதியில் என்ன இயல்பானது",blocks:[{type:"p",text:s}]},{heading:"4. உங்கள் முதல் மாதவிடாய் கிட்",blocks:[{type:"p",text:"ஒரு சிறிய கிட்டைத் தயாராக வைத்திருங்கள். இவற்றில் எதுவும் சரியே — உங்களுக்கு வசதியானதை, எளிதில் கிடைப்பதைத் தேர்ந்தெடுங்கள். எந்தத் தேர்வும் மற்றொன்றை விட உயர்ந்ததோ தாழ்ந்ததோ அல்ல:"},{type:"kit",items:[{t:"யூஸ் அண்ட் த்ரோ சானிட்டரி பேட்",d:"எந்த மருந்துக் கடையிலும் கிராமக் கடையிலும் சிறிய, குறைந்த விலைப் பொட்டலங்களில் கிடைக்கும். தொடக்கத்திற்கும் பள்ளிக்கும் எளிது."},{t:"மீண்டும் பயன்படுத்தும் துணி பேட்",d:"கழுவி பல மாதங்கள் பயன்படுத்தலாம் — நாளடைவில் சிக்கனம். வெயிலில் நன்கு உலர்த்தவும்."},{t:"சுத்தமான மென்மையான பருத்தித் துணி",d:"பல அம்மாக்கள் பயன்படுத்திய பாரம்பரிய வழி. சோப்பு போட்டுக் கழுவி, வெயிலில் உலர்த்தி, உலர்ந்து சுத்தமாக வைக்கவும்."},{t:"மென்ஸ்ட்ருவல் கப்",d:"பல ஆண்டுகள் பயன்படுத்தும் மென்மையான கப் — மிகச் சிக்கனம், சுற்றுச்சூழலுக்கும் நல்லது. கொஞ்சம் பழக்கம் தேவை."},{t:"ஒரு சிறிய பை",d:"கூடுதல் உள்ளாடை, பயன்படுத்தியதைச் சுற்ற காகிதம்/பழைய நாளிதழ், சிறிது சோப்பு — பள்ளிப் பையில் வைத்திருங்கள்."}]}]},{heading:"5. அது நடக்கும்போது என்ன செய்வது",blocks:[{type:"ol",items:["மெதுவாக மூச்சு விடுங்கள் — எந்தத் தவறும் இல்லை. உங்கள் உடல் சரியாகச் செயல்படுகிறது.","கழிப்பறைக்குச் செல்லுங்கள். உள்ளாடையில் பேட் வைக்கவும், அல்லது மடித்த சுத்தமான துணி/கப் பயன்படுத்தவும்.","கையில் ஒன்றும் இல்லாவிட்டால், தற்காலிகமாக டிஷ்யூ/சுத்தமான துணியை மடித்து வைத்து, நம்பகமான ஒருவரிடம் சொல்லுங்கள்.","ஒவ்வொரு 4–6 மணி நேரத்திற்கும் பேட்/துணியை மாற்றவும்; அதிகமாக இருந்தால் அடிக்கடி.","கைகளைக் கழுவவும். பயன்படுத்தியதைக் காகிதத்தில் சுற்றி குப்பையில் போடவும் — பேட்டை கழிவறையில் ஊற்ற வேண்டாம்.","தண்ணீர் குடித்து, சரியாகச் சாப்பிடுங்கள். வலிக்கு வெதுவெதுப்பான துணியை அடிவயிற்றில் வைக்கவும்.","தேதியை எங்காவது (அல்லது MIRA-வில்) குறித்து வையுங்கள்."]}]},{heading:"6. கேட்கத் தயங்கும் கேள்விகள்",blocks:[{type:"qa",items:[{q:"எனக்கு மாதவிடாய் என்று மற்றவர்களுக்குத் தெரிந்துவிடுமா?",a:"இல்லை. யாருக்கும் தெரியாது. பேட்/துணி/கப் வைத்திருந்தால் நீங்கள் இயல்பாகவே இருப்பீர்கள். இது உங்கள் தனிப்பட்ட விஷயம்."},{q:"குளிக்கலாமா, விளையாடலாமா, பள்ளிக்குப் போகலாமா?",a:"எல்லாம் செய்யலாம் — வெதுவெதுப்பான குளியல் புத்துணர்ச்சி தந்து வலியையும் குறைக்கும். கோயில்/சமையல் பழக்கவழக்கங்கள் குடும்பத்திற்குக் குடும்பம் மாறுபடும்; உங்களுக்குச் சரியெனத் தோன்றுவதைச் செய்யுங்கள், ஒரு பெரியவரிடம் பேசுங்கள். மாதவிடாயில் அசுத்தம் எதுவும் இல்லை."},{q:"ரத்தம் அசுத்தமா, ஏதோ தவறின் அறிகுறியா?",a:"இல்லவே இல்லை. இது உங்கள் உடல் நன்கு வளர்கிறது என்பதற்கான ஆரோக்கியமான அறிகுறி. மொத்தத்தில் சில ஸ்பூன் அளவே இருந்தாலும் அதிகமாகத் தெரியலாம். இது சுத்தமானது, பயப்பட ஒன்றுமில்லை."}]}]}],note:{heading:`உங்களுக்கு ஒரு குறிப்பு (${_r.ta[t]})`,text:a[t]}}}function w1({age:e,relationship:t,insight:n}){const s=n&&n!=="No local data available yet"?`మీ ప్రాంతం గురించి ఒక నిజం: ${n}. అంటే మీ చుట్టూ ఉన్న చాలా అమ్మాయిలు కూడా ఇదే అనుభవిస్తున్నారు — మీరు ఒంటరిగా లేరు.`:"మీ ప్రాంతానికి సంబంధించిన నిర్దిష్ట సమాచారం ఇంకా లేదు, కానీ ఇది ఎప్పుడూ నిజం: మీ వీధి, పాఠశాల, ఊరిలోని అమ్మాయిలందరికీ కూడా నెలసరి వస్తుంది. ఇది ప్రపంచంలో అత్యంత సహజమైనది. మీరు ఒంటరిగా లేరు.",a={sister:"ఆమెకు నమ్మకమైన స్నేహితురాలిగా ఉండండి. ప్రశాంతంగా, ప్రేమగా స్పందించండి — ఎగతాళి వద్దు, పెద్దగా చేయవద్దు. ఒక ప్యాడ్ లేదా గుడ్డను సిద్ధంగా ఉంచి, ఎలా వాడాలో ఒకసారి చూపించండి. మీ ప్రశాంతతే ఆమెకు ధైర్యం.",parent:"ఈ రోజును ఆమె ఎలా గుర్తుంచుకుంటుందో మీ స్పందనపైనే ఆధారపడి ఉంటుంది. ప్రశాంతంగా, సహజంగా ఉండండి — ఇది ఆరోగ్యం, దాచవలసిన సిగ్గు కాదు. ఇంట్లో అవసరమైనవి ఉంచండి, నొప్పి ఉంటే విశ్రాంతి ఇవ్వండి.",teacher:"పాఠశాలలో అదనపు ప్యాడ్‌లు, శుభ్రమైన స్థలం ఉంచండి. ప్రశ్నలు లేకుండా టాయిలెట్‌కు వెళ్లనివ్వండి, నెలసరిలో ఉన్న అమ్మాయిని అందరి దృష్టికి తీసుకురావద్దు. ప్రశాంతమైన తరగతి అమ్మాయిలను పాఠశాలలో ఉంచుతుంది.",ngo:"ఈ గైడ్‌తో పాటు ఒక నిజమైన కిట్‌ను, చిన్న స్నేహపూర్వక సెషన్‌ను ఇవ్వండి. స్థానిక భాషలో మాట్లాడండి, పేరు చెప్పకుండా ప్రశ్నలు అడగనివ్వండి. ఉపన్యాసం కాదు — సహజం చేయండి; గౌరవం, వస్తువులు కలిస్తే అమ్మాయిలు ఆత్మవిశ్వాసంతో పాఠశాలలో ఉంటారు."};return{languageLabel:"తెలుగు",title:"మొదటి నెలసరి సన్నద్ధత గైడ్",metaLabel:`${e} సంవత్సరాల అమ్మాయి కోసం · ${_r.te[t]} తయారు చేసినది`,sections:[{heading:"1. నెలసరి అంటే ఏమిటి?",blocks:[{type:"p",text:"మీ వయసులో మీ శరీరం నెమ్మదిగా పెద్దదవుతోంది — దానికి ఒక సంకేతమే మొదటి నెలసరి."},{type:"p",text:"ప్రతి నెలా మీ శరీరం సిద్ధమవుతుంది. అవసరం లేనప్పుడు, లోపల ఉన్న మెత్తని పొర కొన్ని రోజులపాటు కొద్దిగా రక్తంలా బయటకు వస్తుంది. అదే నెలసరి. ఇది ఆరోగ్యకరం, సహజం, ప్రపంచంలోని దాదాపు అందరు అమ్మాయిలకూ జరిగేదే."}]},{heading:"2. నేను ఎలా అనిపిస్తాను?",blocks:[{type:"p",text:"నెలసరికి ముందు లేదా ఆ రోజుల్లో ఇవి ఉండవచ్చు:"},{type:"ul",items:["పొత్తికడుపులో తేలికపాటి నొప్పి","కొంచెం అలసట లేదా నిద్ర","రొమ్ములలో స్వల్ప నొప్పి","కొన్ని మొటిమలు లేదా కడుపు ఉబ్బరం","మానసిక మార్పులు — సంతోషం, ఏడుపు లేదా చిరాకు"]},{type:"p",text:"ఇవన్నీ పూర్తిగా సహజం. కొన్ని రోజుల్లో సర్దుకుంటాయి."},{type:"callout",label:"ఇవి ఉంటే పెద్దవారికి లేదా వైద్యురాలికి చెప్పండి:",items:["ప్రతి 1–2 గంటలకు ప్యాడ్/గుడ్డ పూర్తిగా తడిస్తే","విశ్రాంతి తర్వాత కూడా ఏమీ చేయలేని తీవ్ర నొప్పి","రక్తస్రావం 7–8 రోజులకు మించి కొనసాగితే","తల తిరగడం, తీవ్ర అలసట లేదా ఊపిరి ఆడకపోవడం"]}]},{heading:"3. మీ ప్రాంతంలో ఏది సాధారణం",blocks:[{type:"p",text:s}]},{heading:"4. మీ మొదటి నెలసరి కిట్",blocks:[{type:"p",text:"ఒక చిన్న కిట్‌ను సిద్ధంగా ఉంచుకోండి. వీటిలో ఏదైనా మంచిదే — మీకు సౌకర్యంగా, సులభంగా దొరికేది ఎంచుకోండి. ఏ ఎంపికా మరొకదాని కంటే గొప్పదో తక్కువదో కాదు:"},{type:"kit",items:[{t:"యూజ్ అండ్ త్రో శానిటరీ ప్యాడ్‌లు",d:"ఏ మెడికల్ షాప్‌లోనైనా, కిరాణా దుకాణంలోనైనా చిన్న, తక్కువ ధర ప్యాక్‌లలో దొరుకుతాయి. మొదట్లో, పాఠశాలకు సులభం."},{t:"మళ్లీ వాడే గుడ్డ ప్యాడ్‌లు",d:"ఉతికి చాలా నెలలు వాడవచ్చు — కాలక్రమేణా పొదుపు. ఎండలో బాగా ఆరబెట్టండి."},{t:"శుభ్రమైన మెత్తని పత్తి గుడ్డ",d:"చాలా మంది అమ్మలు వాడిన సంప్రదాయ పద్ధతి. సబ్బుతో ఉతికి, ఎండలో ఆరబెట్టి, పొడిగా శుభ్రంగా ఉంచండి."},{t:"మెన్‌స్ట్రువల్ కప్",d:"చాలా సంవత్సరాలు వాడే మెత్తని కప్ — చాలా పొదుపు, పర్యావరణానికీ మంచిది. కొంచెం అలవాటు కావాలి."},{t:"ఒక చిన్న సంచి",d:"అదనపు లోదుస్తు, వాడినదాన్ని చుట్టడానికి కాగితం/పాత వార్తాపత్రిక, కొంచెం సబ్బు — స్కూల్ బ్యాగ్‌లో ఉంచండి."}]}]},{heading:"5. అది జరిగినప్పుడు ఏం చేయాలి",blocks:[{type:"ol",items:["నెమ్మదిగా ఊపిరి తీసుకోండి — ఏ తప్పూ లేదు. మీ శరీరం సరిగ్గా పని చేస్తోంది.","టాయిలెట్‌కు వెళ్లండి. లోదుస్తుపై ప్యాడ్ పెట్టండి, లేదా మడిచిన శుభ్రమైన గుడ్డ/కప్ వాడండి.","చేతిలో ఏమీ లేకపోతే, తాత్కాలికంగా టిష్యూ/శుభ్రమైన గుడ్డ మడిచి పెట్టి, నమ్మకమైన వారికి చెప్పండి.","ప్రతి 4–6 గంటలకు ప్యాడ్/గుడ్డ మార్చండి; ఎక్కువగా ఉంటే తరచుగా.","చేతులు కడుక్కోండి. వాడినదాన్ని కాగితంలో చుట్టి చెత్తబుట్టలో వేయండి — ప్యాడ్‌ను టాయిలెట్‌లో వేయవద్దు.","నీళ్లు తాగి, మామూలుగా తినండి. నొప్పికి వెచ్చని గుడ్డను పొత్తికడుపుపై పెట్టండి.","తేదీని ఎక్కడైనా (లేదా MIRAలో) గుర్తు పెట్టుకోండి."]}]},{heading:"6. అడగడానికి సిగ్గుపడే ప్రశ్నలు",blocks:[{type:"qa",items:[{q:"నాకు నెలసరి ఉందని ఇతరులకు తెలిసిపోతుందా?",a:"లేదు. ఎవరికీ కనిపించదు. ప్యాడ్/గుడ్డ/కప్ ఉంటే మీరు మామూలుగానే ఉంటారు. ఇది మీ వ్యక్తిగత విషయం."},{q:"స్నానం చేయవచ్చా, ఆడవచ్చా, పాఠశాలకు వెళ్లవచ్చా?",a:"అన్నీ చేయవచ్చు — వెచ్చని స్నానం తాజాదనం ఇచ్చి నొప్పిని తగ్గిస్తుంది. గుడి/వంటగది ఆచారాలు కుటుంబానికి కుటుంబం మారతాయి; మీకు సరైనదని అనిపించింది చేయండి, పెద్దవారితో మాట్లాడండి. నెలసరిలో అపరిశుభ్రత ఏదీ లేదు."},{q:"రక్తం మురికిదా, ఏదో తప్పు జరిగిందనే సంకేతమా?",a:"అస్సలు కాదు. ఇది మీ శరీరం బాగా పెరుగుతోందనే ఆరోగ్య సంకేతం. మొత్తంగా కొన్ని స్పూన్‌ల మోతాదే అయినా ఎక్కువగా కనిపించవచ్చు. ఇది శుభ్రం, భయపడాల్సింది ఏమీ లేదు."}]}]}],note:{heading:`మీ కోసం ఒక మాట (${_r.te[t]})`,text:a[t]}}}const _1={English:tx,Tamil:v1,Telugu:w1};function b1({age:e=12,language:t="English",relationship:n="sister",insight:s=""}={}){return(_1[t]||tx)({age:e,relationship:n,insight:(s||"").trim()})}function j1(e){const t=[e.title,e.metaLabel,""];for(const n of e.sections){t.push(n.heading);for(const s of n.blocks)s.type==="p"?t.push(s.text):s.type==="ul"?s.items.forEach(a=>t.push("• "+a)):s.type==="ol"?s.items.forEach((a,l)=>t.push(`${l+1}. ${a}`)):s.type==="kit"?s.items.forEach(a=>t.push(`• ${a.t} — ${a.d}`)):s.type==="qa"?s.items.forEach(a=>t.push(`Q: ${a.q}`,`A: ${a.a}`)):s.type==="callout"&&(t.push(s.label),s.items.forEach(a=>t.push("• "+a)));t.push("")}return t.push(e.note.heading,e.note.text,"","— MIRA · powered by MHIN"),t.join(`

inside the uterus leaves through the vagina as blood, over a few days. It’s a normal, healthy sign your body is growing up."},{h:"Why does it happen?",b:"Each month your body prepares in case of pregnancy. When that doesn’t happen, the lining is no longer needed and gently sheds — that’s your period."},{h:"How to feel ready",b:"Keep a pad or two and a spare underwear in your bag. Periods usually last 3–7 days. Rest, water and warmth help if you feel crampy."}],quiz:{q:"About how many days does a period usually last?",options:["A few hours","3–7 days","2–3 weeks"],answer:1}},{id:"cycle",emoji:"🩸",title:"The Menstrual Cycle",level:"Beginner",mins:4,accent:"text-accent-secondary",cards:[{h:"It’s a monthly rhythm",b:"The cycle is the whole month, not just your period. It’s counted from the first day of one period to the first day of the next — around 28 days on average, but 21–35 is normal."},{h:"Four phases",b:"Menstrual (your period), follicular (energy builds), ovulation (an egg is released), and luteal (before your next period). Each brings different energy and moods."},{h:"Why track it?",b:"Tracking helps you predict your period, understand your moods and energy, and spot anything unusual to talk to a doctor about."}],quiz:{q:"The menstrual cycle is counted from…",options:["The last day of a period","The first day of one period to the next","Ovulation day"],answer:1}},{id:"hormones",emoji:"🌙",title:"Hormonal Changes",level:"Intermediate",mins:3,accent:"text-accent-ai",cards:[{h:"Two key hormones",b:"Estrogen rises in the first half of your cycle and lifts energy and mood. Progesterone rises after ovulation and can make you feel calmer or more tired."},{h:"Why moods shift",b:"As these hormones rise and fall, your energy, appetite, sleep and emotions naturally change. It’s biology — not you “being difficult”."},{h:"Working with them",b:"Plan demanding things for your higher-energy days, and give yourself rest and comfort in the days before your period."}],quiz:{q:"Which hormone rises after ovulation?",options:["Progesterone","Insulin","Vitamin D"],answer:0}},{id:"products",emoji:"🧴",title:"Menstrual Products",level:"Beginner",mins:4,accent:"text-success",cards:[{h:"Pads",b:"Stick to your underwear and absorb flow. Easy to start with. Change every 4–6 hours (sooner if heavy) to stay fresh and safe."},{h:"Tampons & cups",b:"Tampons absorb inside; menstrual cups collect flow and are reusable and eco-friendly. Both need clean hands and regular changing/emptying."},{h:"There’s no “best”",b:"Period underwear, reusable pads, liners — the right choice is what feels comfortable and practical for you. You can mix and match."}],quiz:{q:"Roughly how often should a pad be changed?",options:["Once a day","Every 4–6 hours","Only when full"],answer:1}},{id:"nutrition",emoji:"🥗",title:"Nutrition",level:"Beginner",mins:3,accent:"text-success",cards:[{h:"Iron matters",b:"You lose a little iron during your period. Leafy greens, dates, lentils, beans and (if you eat it) meat help replenish it and fight tiredness."},{h:"Steady energy",b:"Whole grains, fruit and protein keep blood sugar steady, which helps mood and cravings. Pair iron foods with vitamin C (like lemon) to absorb more."},{h:"Hydrate",b:"Water eases bloating and headaches. Warm drinks like ginger tea can also soothe cramps."}],quiz:{q:"Which helps your body absorb more iron?",options:["Vitamin C (e.g. lemon)","Coffee","Skipping meals"],answer:0}},{id:"selfcare",emoji:"🧘",title:"Self Care",level:"Beginner",mins:2,accent:"text-accent-secondary",cards:[{h:"Ease the cramps",b:"A warm compress on your lower belly, gentle stretching and a short walk all help relax the muscles that cause cramps."},{h:"Rest is productive",b:"It’s okay to slow down before and during your period. Early nights and gentle days are a form of looking after yourself."},{h:"Small rituals",b:"A warm bath, your favourite tea, comfy clothes — tiny comforts genuinely help your body and mood."}],quiz:{q:"What can help relax cramp muscles?",options:["A warm compress","Holding your breath","Ignoring it"],answer:0}},{id:"mental",emoji:"💙",title:"Mental Wellness",level:"Intermediate",mins:3,accent:"text-accent-ai",cards:[{h:"PMS is real",b:"Feeling low, irritable or tearful in the days before your period is common — it’s linked to hormone changes, not a flaw in you."},{h:"Be gentle with yourself",b:"Name what you feel, rest, move gently, and talk to someone you trust. Slow breathing (in for 4, out for 6) calms the body quickly."},{h:"When to get support",b:"If low mood is severe, lasts most of the month, or affects daily life, that’s worth talking to a doctor or counsellor about — you deserve support."}],quiz:{q:"A quick way to calm your body is…",options:["Slow breathing (in 4, out 6)","Holding your breath","More caffeine"],answer:0}},{id:"pcos",emoji:"🧬",title:"PCOS Awareness",level:"Intermediate",mins:4,accent:"text-accent-primary",cards:[{h:"What is PCOS?",b:"Polycystic ovary syndrome is a common hormonal condition. It can cause irregular periods, acne, extra hair growth or weight changes — it varies a lot between people."},{h:"It’s manageable",b:"Gentle regular movement, balanced meals and good sleep genuinely help. There are also medical treatments — you’re not meant to figure it out alone."},{h:"Getting checked",b:"Diagnosis needs a doctor (often an ultrasound and blood tests). Tracking your cycle here gives them a clear picture to work from."}],quiz:{q:"PCOS is…",options:["A common hormonal condition","Contagious","Always visible"],answer:0}},{id:"endo",emoji:"🧫",title:"Endometriosis",level:"Advanced",mins:3,accent:"text-accent-secondary",cards:[{h:"What is it?",b:"Endometriosis is when tissue like the uterus lining grows outside it. It can cause very painful periods and pelvic pain — and it’s often under-recognised."},{h:"Pain is not “just periods”",b:"Pain that stops you doing normal things, or that painkillers barely touch, is not something you have to accept. It’s worth investigating."},{h:"When to see a doctor",b:"If period pain is severe, worsening, or comes with pain during sex or going to the toilet, please talk to a gynaecologist."}],quiz:{q:"Severe period pain that disrupts life…",options:["Should be checked by a doctor","Is always normal","Means nothing"],answer:0}}],$t=[{s:"You shouldn’t exercise during your period.",myth:!0,why:"Gentle movement can actually ease cramps and lift your mood. Listen to your body — rest if you need to."},{s:"You can still get pregnant on your period.",myth:!1,why:"It’s less likely but possible, especially with shorter or irregular cycles. This is a fact."},{s:"Irregular periods are always dangerous.",myth:!0,why:"Occasional irregularity is common with stress, travel or age. Persistent changes are worth a check-up, though."},{s:"PMS symptoms are “all in your head”.",myth:!0,why:"PMS is driven by real hormone changes. Your experience is valid."},{s:"Drinking water can reduce bloating.",myth:!1,why:"Staying hydrated genuinely helps reduce bloating and headaches. Fact!"},{s:"You must avoid cold food during your period.",myth:!0,why:"There’s no medical evidence for this. Eat what feels good and nourishing to you."}],Gp=[{tag:"Fact",text:"Your cycle length can shift by a few days month to month — that’s completely normal."},{tag:"Nutrition",text:"Pairing iron-rich foods with vitamin C (like a squeeze of lemon) helps your body absorb more iron."},{tag:"Self-care",text:"A warm compress on your lower belly can relax the muscles that cause cramps."},{tag:"Fact",text:"The average period releases only about 30–80 ml of blood across the whole period — less than it feels."},{tag:"Mind",text:"Slow breathing — in for four, out for six — calms your nervous system in under a minute."},{tag:"Fact",text:"Ovulation usually happens about 14 days before your next period, not on “day 14”."},{tag:"Self-care",text:"Feeling extra tired before your period? That’s hormones — an earlier night genuinely helps."}],nx="mira.learn.v1
